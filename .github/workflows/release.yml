name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test
        run: cargo test --workspace --locked
      - name: Build portable executable
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          cargo build --release --locked --target x86_64-pc-windows-gnu -p astro-selector
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/astro-selector.exe dist/AstroImageSelector.exe -Force
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AstroImageSelector.exe
            licenses/PHOTUTILS-AND-SCIPY.txt
