[package]
name = "astro-measurements"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
levenberg-marquardt = { version = "0.15", features = ["minpack-compat"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
